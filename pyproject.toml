[project]
name = "ahost"
version = "0.1.0"
description = "Self-hosted app hosting for a single Linux server: systemd + nginx + certbot from one manifest per app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "tomlkit>=0.13",
    "jinja2>=3.1",
    "typer>=0.12",
    "fastapi>=0.142.2",
    "uvicorn>=0.30",
    "argon2-cffi>=25.1.0",
]

[project.scripts]
ahost = "ahost.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ahost"]

[tool.hatch.build.targets.wheel.force-include]
"docs/agents.md" = "ahost/guide.md"  # printed by `ahost guide`

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
